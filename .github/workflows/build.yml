name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name SistemaCertificacion main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SistemaCertificacion-${{ matrix.os }}
          path: dist/*
